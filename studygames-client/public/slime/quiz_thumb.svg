<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270" role="img" aria-label="Slime Quiz">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>
    <linearGradient id="slime" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="55%" r="55%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <!-- Background -->
  <rect width="480" height="270" fill="url(#bg)"/>
  <rect width="480" height="270" fill="url(#glow)"/>

  <!-- Grid pattern subtle -->
  <g opacity="0.06" stroke="#2dd4bf" stroke-width="1">
    <line x1="0" y1="67.5" x2="480" y2="67.5"/>
    <line x1="0" y1="135" x2="480" y2="135"/>
    <line x1="0" y1="202.5" x2="480" y2="202.5"/>
    <line x1="120" y1="0" x2="120" y2="270"/>
    <line x1="240" y1="0" x2="240" y2="270"/>
    <line x1="360" y1="0" x2="360" y2="270"/>
  </g>

  <!-- Slime body (blob) -->
  <g transform="translate(240, 150)">
    <!-- Shadow -->
    <ellipse cx="0" cy="62" rx="70" ry="10" fill="#000" opacity="0.35" filter="url(#blur)"/>
    <!-- Body -->
    <path d="M -68 30
             C -68 -30, -40 -58, 0 -58
             C 40 -58, 68 -30, 68 30
             C 68 50, 40 58, 0 58
             C -40 58, -68 50, -68 30 Z"
          fill="url(#slime)"/>
    <!-- Highlight -->
    <ellipse cx="-22" cy="-28" rx="18" ry="12" fill="#ffffff" opacity="0.35" transform="rotate(-20 -22 -28)"/>
    <!-- Eyes -->
    <g fill="#0f172a">
      <ellipse cx="-22" cy="6" rx="7" ry="9"/>
      <ellipse cx="22" cy="6" rx="7" ry="9"/>
    </g>
    <g fill="#ffffff">
      <circle cx="-19" cy="3" r="2.5"/>
      <circle cx="25" cy="3" r="2.5"/>
    </g>
    <!-- Mouth (smile) -->
    <path d="M -16 28 Q 0 38, 16 28" stroke="#0f172a" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Floating question marks / hanzi -->
  <g font-family="'Segoe UI', system-ui, sans-serif" font-weight="900" text-anchor="middle">
    <text x="70" y="80" font-size="34" fill="#2dd4bf" opacity="0.55">?</text>
    <text x="400" y="70" font-size="28" fill="#22d3ee" opacity="0.5">?</text>
    <text x="60" y="210" font-size="22" fill="#2dd4bf" opacity="0.4">字</text>
    <text x="410" y="220" font-size="26" fill="#22d3ee" opacity="0.45">学</text>
    <text x="380" y="140" font-size="20" fill="#2dd4bf" opacity="0.35">?</text>
  </g>

  <!-- Title bar -->
  <g transform="translate(240, 232)">
    <rect x="-90" y="-16" width="180" height="32" rx="16" fill="#0f172a" opacity="0.8" stroke="#2dd4bf" stroke-opacity="0.4" stroke-width="1"/>
    <text x="0" y="6" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="800" fill="#2dd4bf" text-anchor="middle" letter-spacing="1.5">SLIME QUIZ</text>
  </g>
</svg>
