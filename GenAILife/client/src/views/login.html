<!DOCTYPE html>
<html lang="vi" class="w-full h-full overflow-hidden">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng Nhập / Đăng Ký · GenAI Life Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body class="w-full h-full overflow-hidden flex items-center justify-center" style="background:radial-gradient(circle at center, #0f172a 0%, #060a14 100%)">
  
  <div class="glass flex flex-col rounded-3xl overflow-hidden w-full max-w-sm" style="background:rgba(15, 23, 42, 0.85);border:1px solid rgba(0, 242, 254, 0.3);box-shadow:0 25px 70px rgba(0,0,0,0.85), 0 0 50px rgba(0,242,254,0.12)">
    
    <!-- Header -->
    <div class="flex items-center justify-between px-6 py-4" style="border-bottom:1px solid rgba(255,255,255,.08);background:linear-gradient(180deg,rgba(0,242,254,.1) 0%,transparent 100%)">
      <div class="flex items-center gap-3">
        <div class="flex items-center justify-center w-11 h-11 rounded-2xl shrink-0" style="background:linear-gradient(135deg,rgba(0,242,254,.25),rgba(124,58,237,.2));border:1px solid rgba(0,242,254,.4);box-shadow:0 0 15px rgba(0,242,254,.3)">
          <i class="fa-solid fa-gamepad text-xl" style="color:#00f2fe"></i>
        </div>
        <div>
          <h1 class="text-base font-bold text-white tracking-tight">GenAI Life Studio</h1>
          <p id="header-subtitle" class="text-xs font-medium" style="color:#94a3b8">Đăng nhập để vào Đấu Trường Game</p>
        </div>
      </div>
    </div>

    <!-- Mode Switcher Tabs -->
    <div class="flex p-2 gap-2" style="background:rgba(6,10,20,.6);border-bottom:1px solid rgba(255,255,255,.06)">
      <button id="tab-btn-login" class="flex-1 py-2 text-xs font-bold rounded-xl transition-all duration-200 text-cyan-400" style="background:rgba(0,242,254,.15);border:1px solid rgba(0,242,254,.4);box-shadow:0 0 10px rgba(0,242,254,.2)">
        <i class="fa-solid fa-right-to-bracket mr-1.5"></i> Đăng Nhập
      </button>
      <button id="tab-btn-register" class="flex-1 py-2 text-xs font-bold rounded-xl transition-all duration-200 text-slate-400 hover:text-white" style="background:transparent;border:1px solid transparent">
        <i class="fa-solid fa-user-plus mr-1.5"></i> Đăng Ký
      </button>
    </div>

    <!-- Login Form -->
    <form id="form-login" class="flex flex-col gap-4 p-6">
      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-semibold tracking-wide" style="color:#cbd5e1">Tên đăng nhập / Email</label>
        <div class="relative flex items-center">
          <i class="fa-solid fa-user absolute left-3.5 text-xs z-10" style="color:#64748b"></i>
          <input type="text" id="login-username" class="form-control !pl-10" placeholder="Nhập username hoặc email..." value="admin" required />
        </div>
      </div>

      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-semibold tracking-wide" style="color:#cbd5e1">Mật khẩu</label>
        <div class="relative flex items-center">
          <i class="fa-solid fa-lock absolute left-3.5 text-xs z-10" style="color:#64748b"></i>
          <input type="password" id="login-password" class="form-control !pl-10" placeholder="Nhập mật khẩu..." value="Hh123457a!" required />
        </div>
      </div>

      <div id="login-error-msg" class="hidden text-xs text-red-400 p-3 rounded-xl" style="background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3)"></div>

      <button type="submit" id="btn-submit-login" class="w-full flex items-center justify-center gap-2 text-xs font-bold py-3 px-4 rounded-xl cursor-pointer transition-all duration-200 hover:scale-[1.02] active:scale-95 text-slate-950" style="background:linear-gradient(135deg,#00f2fe 0%,#00ff88 100%);box-shadow:0 4px 20px rgba(0,242,254,.45)">
        <i class="fa-solid fa-right-to-bracket text-sm"></i> ĐĂNG NHẬP VÀO GAME
      </button>

      <div class="text-[11px] text-center font-medium mt-1" style="color:#64748b">
        <i class="fa-solid fa-bolt mr-1 text-emerald-400"></i>Hệ thống sử dụng JWT &amp; Redis Cache
      </div>
    </form>

    <!-- Register Form (Hidden by default) -->
    <form id="form-register" class="hidden flex-col gap-3.5 p-6">
      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-semibold tracking-wide" style="color:#cbd5e1">Tên tài khoản mới</label>
        <div class="relative flex items-center">
          <i class="fa-solid fa-id-card absolute left-3.5 text-xs z-10" style="color:#64748b"></i>
          <input type="text" id="reg-username" class="form-control !pl-10" placeholder="Ít nhất 3 ký tự (vd: hero_pro)" required />
        </div>
      </div>

      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-semibold tracking-wide" style="color:#cbd5e1">Địa chỉ Email</label>
        <div class="relative flex items-center">
          <i class="fa-solid fa-envelope absolute left-3.5 text-xs z-10" style="color:#64748b"></i>
          <input type="email" id="reg-email" class="form-control !pl-10" placeholder="name@example.com" required />
        </div>
      </div>

      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-semibold tracking-wide" style="color:#cbd5e1">Mật khẩu</label>
        <div class="relative flex items-center">
          <i class="fa-solid fa-key absolute left-3.5 text-xs z-10" style="color:#64748b"></i>
          <input type="password" id="reg-password" class="form-control !pl-10" placeholder="Mật khẩu (ít nhất 6 ký tự)" required />
        </div>
      </div>

      <div id="reg-error-msg" class="hidden text-xs text-red-400 p-3 rounded-xl" style="background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3)"></div>

      <button type="submit" id="btn-submit-register" class="w-full flex items-center justify-center gap-2 text-xs font-bold py-3 px-4 rounded-xl cursor-pointer transition-all duration-200 hover:scale-[1.02] active:scale-95 text-white" style="background:linear-gradient(135deg,#7c3aed 0%,#c026d3 100%);box-shadow:0 4px 20px rgba(124,58,237,.45)">
        <i class="fa-solid fa-user-plus text-sm"></i> ĐĂNG KÝ TÀI KHOẢN
      </button>

      <div class="text-[11px] text-center font-medium mt-1" style="color:#64748b">
        🔒 Mật khẩu được mã hóa an toàn với Bcrypt
      </div>
    </form>

  </div>

  <script>
    const token = localStorage.getItem('jwt_token');
    if (token) {
      fetch('/api/auth/me', { headers: { 'Authorization': 'Bearer ' + token } })
        .then(r => r.json())
        .then(d => {
          if (d.authenticated) window.location.href = '/';
        })
        .catch(() => {});
    }

    const tabBtnLogin = document.getElementById('tab-btn-login');
    const tabBtnRegister = document.getElementById('tab-btn-register');
    const formLogin = document.getElementById('form-login');
    const formRegister = document.getElementById('form-register');
    const headerSubtitle = document.getElementById('header-subtitle');

    // Switch between Login and Register tabs
    tabBtnLogin.addEventListener('click', () => {
      formLogin.classList.remove('hidden');
      formLogin.classList.add('flex');
      formRegister.classList.add('hidden');
      formRegister.classList.remove('flex');

      tabBtnLogin.style.background = 'rgba(0,242,254,.15)';
      tabBtnLogin.style.borderColor = 'rgba(0,242,254,.4)';
      tabBtnLogin.style.boxShadow = '0 0 10px rgba(0,242,254,.2)';
      tabBtnLogin.className = 'flex-1 py-2 text-xs font-bold rounded-xl transition-all duration-200 text-cyan-400';

      tabBtnRegister.style.background = 'transparent';
      tabBtnRegister.style.borderColor = 'transparent';
      tabBtnRegister.style.boxShadow = 'none';
      tabBtnRegister.className = 'flex-1 py-2 text-xs font-bold rounded-xl transition-all duration-200 text-slate-400 hover:text-white';
      
      headerSubtitle.textContent = 'Đăng nhập để vào Đấu Trường Game';
    });

    tabBtnRegister.addEventListener('click', () => {
      formRegister.classList.remove('hidden');
      formRegister.classList.add('flex');
      formLogin.classList.add('hidden');
      formLogin.classList.remove('flex');

      tabBtnRegister.style.background = 'rgba(124,58,237,.2)';
      tabBtnRegister.style.borderColor = 'rgba(124,58,237,.4)';
      tabBtnRegister.style.boxShadow = '0 0 10px rgba(124,58,237,.2)';
      tabBtnRegister.className = 'flex-1 py-2 text-xs font-bold rounded-xl transition-all duration-200 text-purple-400';

      tabBtnLogin.style.background = 'transparent';
      tabBtnLogin.style.borderColor = 'transparent';
      tabBtnLogin.style.boxShadow = 'none';
      tabBtnLogin.className = 'flex-1 py-2 text-xs font-bold rounded-xl transition-all duration-200 text-slate-400 hover:text-white';

      headerSubtitle.textContent = 'Tạo tài khoản mới để bắt đầu chơi';
    });

    // Login Form Submit
    formLogin.addEventListener('submit', async (e) => {
      e.preventDefault();
      const errBox = document.getElementById('login-error-msg');
      errBox.classList.add('hidden');

      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value.trim();

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (!res.ok) {
          errBox.textContent = data.error || 'Đăng nhập thất bại!';
          errBox.classList.remove('hidden');
          return;
        }

        localStorage.setItem('jwt_token', data.token);
        if (!data.hasPlayers) {
          window.location.href = '/create-character';
        } else {
          window.location.href = '/';
        }
      } catch (err) {
        errBox.textContent = 'Lỗi kết nối Server!';
        errBox.classList.remove('hidden');
      }
    });

    // Register Form Submit
    formRegister.addEventListener('submit', async (e) => {
      e.preventDefault();
      const errBox = document.getElementById('reg-error-msg');
      errBox.classList.add('hidden');

      const username = document.getElementById('reg-username').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value.trim();

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, email, password })
        });
        const data = await res.json();
        if (!res.ok) {
          errBox.textContent = data.error || 'Đăng ký thất bại!';
          errBox.classList.remove('hidden');
          return;
        }

        // Save JWT token & Redirect to character creation page for new user
        localStorage.setItem('jwt_token', data.token);
        window.location.href = '/create-character';
      } catch (err) {
        errBox.textContent = 'Lỗi kết nối Server!';
        errBox.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
